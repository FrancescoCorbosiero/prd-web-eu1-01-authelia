# yaml-language-server: $schema=https://www.authelia.com/schemas/v4.39/json-schema/configuration.json
# -----------------------------------------------------------------------------
# Authelia on prd-web-eu1-01: this server's settings, kept in git. Change them
# with a commit, then on the server: git pull && docker compose restart authelia
# (nobody is signed out). A new site: README.md, "Protect another site".
#
# The sites are listed twice: under `session.cookies` (where people sign in)
# and in `access_control` (who may open what). No secrets in here: they are
# files in ../secrets, and the people are in users.yml, outside git.
# -----------------------------------------------------------------------------

theme: auto

server:
  # The sign-in pages are served on each protected address under /authelia
  # (Caddy sends /authelia* here): the Vetrina's home-screen app signs in
  # without leaving its own address. Caddy's checks go to /api/authz/...,
  # which Authelia answers too.
  address: tcp://:9091/authelia

log:
  level: info

# Name and password only: no second factor (authenticator app, passkey) is
# asked, offered or registered. Every rule below is one_factor. To bring it
# back, enable these again and set a rule's policy to two_factor.
totp:
  disable: true
webauthn:
  disable: true

authentication_backend:
  # No email server, so no "forgot password" link: an operator sets a new one
  # (README.md). Signed in, people can change their own password.
  password_reset:
    disable: true
  file:
    path: /etc/authelia/users.yml
    # Edits to users.yml apply without a restart.
    watch: true

password_policy:
  # Applies when someone changes their password from the sign-in pages.
  zxcvbn:
    enabled: true
    min_score: 3

session:
  # Kept in Redis on disk (docker-compose.yml): restarts sign nobody out.
  redis:
    host: redis
    port: 6379
  # Without "Remember me": signed out after an idle hour, or after 12 hours.
  inactivity: 1 hour
  expiration: 12 hours
  # With "Remember me": a month, idle or not.
  remember_me: 1 month
  cookies:
    # One entry per address, each with its own sign-in pages under /authelia.
    # A session is valid on its own address only: signing in on the Hub does
    # not open the Vetrina, and the cookie never reaches the shop's own site or
    # any other subdomain.

    # Store Hub, Shoes Clothing Store
    - domain: hub.shoesclothingstore.com
      authelia_url: https://hub.shoesclothingstore.com/authelia
      default_redirection_url: https://hub.shoesclothingstore.com/
    - domain: vetrina.shoesclothingstore.com
      authelia_url: https://vetrina.shoesclothingstore.com/authelia
      default_redirection_url: https://vetrina.shoesclothingstore.com/
      # The phone app stays signed in for three months.
      remember_me: 3 months

    # Store Hub, Resell Piacenza
    - domain: hub.resellpiacenza.shop
      authelia_url: https://hub.resellpiacenza.shop/authelia
      default_redirection_url: https://hub.resellpiacenza.shop/
    - domain: vetrina.resellpiacenza.shop
      authelia_url: https://vetrina.resellpiacenza.shop/authelia
      default_redirection_url: https://vetrina.resellpiacenza.shop/
      # The phone app stays signed in for three months, as it did with the
      # old password.
      remember_me: 3 months

regulation:
  # Five wrong passwords for a user within ten minutes lock that user out for
  # fifteen. By user, not by IP: behind Cloudflare every visitor arrives from
  # Cloudflare's addresses, and banning one of those would lock out everyone
  # who shares it.
  modes:
    - user
  max_retries: 5
  find_time: 10 minutes
  ban_time: 15 minutes

storage:
  # Bans after wrong passwords: in the data volume (docker-compose.yml).
  local:
    path: /config/db.sqlite3

notifier:
  # No email server: Authelia's rare emails (a new sign-in method, a password
  # reset) are written to this file instead. Nothing needs it with name and
  # password only.
  filesystem:
    filename: /config/notification.txt

access_control:
  # Anything not allowed below is refused, including any address Caddy sends
  # here that is not listed.
  default_policy: deny
  rules:
    # Every Store Hub: the home-screen app's install files. They hold no
    # data, and phones fetch them without the session cookie.
    - domain:
        - hub.shoesclothingstore.com
        - vetrina.shoesclothingstore.com
        - hub.resellpiacenza.shop
        - vetrina.resellpiacenza.shop
      resources:
        - '^/manifest\.webmanifest$'
        - '^/(apple-)?icon([?].*)?$'
      policy: bypass

    # Each shop: its Hub and its Vetrina, for the shop's group and for the
    # operators (group operators opens every shop).
    - domain:
        - hub.shoesclothingstore.com
        - vetrina.shoesclothingstore.com
      subject:
        - 'group:operators'
        - 'group:shoesclothingstore'
      policy: one_factor

    - domain:
        - hub.resellpiacenza.shop
        - vetrina.resellpiacenza.shop
      subject:
        - 'group:operators'
        - 'group:resellpiacenza'
      policy: one_factor

    # Only if an external scheduler calls a Hub's cron endpoints
    # (SCHEDULER=off and CRON_SECRET, see Store Hub's README): they carry their
    # own secret instead of a session. Not needed with the in-app scheduler.
    # - domain: hub.resellpiacenza.shop
    #   resources:
    #     - '^/api/cron/'
    #   methods:
    #     - POST
    #   policy: bypass
