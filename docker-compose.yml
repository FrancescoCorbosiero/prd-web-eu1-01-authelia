# Authelia: the sign-in in front of the sites on this server (prd-web-eu1-01).
# Caddy asks it about each request (forward auth) before a site sees it.
# One per server, like Caddy: a new site adds its addresses to
# config/configuration.yml instead of running another Authelia.
#
# This repo is cloned once, to /srv/authelia, and runs from there (README.md):
#
#   git clone https://github.com/FrancescoCorbosiero/prd-web-eu1-01-authelia /srv/authelia
#   cd /srv/authelia && bin/setup      # secrets and users.yml
#   docker compose up -d
#
# The sites reach it as authelia:9091 on Caddy's network (their Caddy labels),
# so the service keeps that name. The project name is fixed, so its volumes
# are always authelia_data and authelia_sessions.
name: authelia

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  authelia:
    image: authelia/authelia:4.39
    restart: unless-stopped
    environment:
      # Settings, users and secrets live outside /config: the image chowns
      # /config at start, and there it only touches the data volume below.
      X_AUTHELIA_CONFIG: /etc/authelia/configuration.yml
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/storage_encryption_key
      TZ: ${TZ:-Europe/Rome}
    secrets:
      - session_secret
      - storage_encryption_key
    volumes:
      # A folder, not single files: editors replace a file when they save, and
      # a single-file mount would keep showing the old one. Writable because
      # Authelia saves users.yml when someone changes their password.
      - ./config:/etc/authelia
      # The database (2FA devices, passkeys, bans) and notification.txt.
      - data:/config
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - caddy
      - internal
    logging: *logging

  redis:
    # The sessions, saved to disk: a restart or a reboot signs nobody out.
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - sessions:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    logging: *logging

secrets:
  session_secret:
    file: ./secrets/SESSION_SECRET
  storage_encryption_key:
    file: ./secrets/STORAGE_ENCRYPTION_KEY

networks:
  # The network your caddy-docker-proxy container watches (the same one the
  # shop stacks join).
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy}
  # The session store: reachable by Authelia only.
  internal: {}

volumes:
  data:
  sessions:
